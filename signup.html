<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/signup.css">
</head>
<body>
    <header>
        <a href="#" class="logo">Naturally a Deal</a>
        <nav>
            <a href="signup.html" class="current-page">Log In / Sign Up</a>
        </nav>
    </header>

    <section class="left">
        
    </section> 

    <main>
        <form>
            <section class="personal-section">
                <h2>Personal Information</h2>

                <fieldset class="field">
                    <label for="name" class="field-label">Name *</label>
                    <input type="text" id="name" class="input" placeholder="Your name" required>
                </fieldset>

                <fieldset class="field">
                    <label for="email" class="field-label">Email *</label>
                    <input type="email" id="email" class="input" placeholder="Email address" required>
                </fieldset>

                <fieldset class="field">
                    <label for="phone" class="field-label">Phone *</label>
                    <input type="tel" id="phone" class="input" placeholder="(731) 555-0000" required>
                </fieldset>

                <fieldset class="field">
                    <label for="password" class="field-label">Password</label>
                    <input type="password" id="password" class="input" required>
                </fieldset>
            </section>

            <section class="coop-section">
                <h2>Co-Op Group</h2>

                <fieldset class="field">
                    <legend class="field-label">Which co-op group do you want to join?</legend>

                    <label for="coop" class="field-label">Co-Op</label>
                    <select id="coop" required>
                        <option value="placeholder">-- Select a Co-Op --</option>
                        <option value="temp1">Temporary Option 1</option>
                        <option value="temp2">Temporary Option 2</option>
                        <option value="temp3">Temporary Option 3</option>
                        <option value="temp4">Temporary Option 4</option>
                    </select>
                </fieldset>
            </section>

            <section class="mailing-section">
                <h2>Mailing Address</h2>
                
                <fieldset class="field">
                    <label for="address1">Address 1</label>
                    <input type="text" id="address1" class="input" required>
                </fieldset>

                <fieldset class="field">
                    <label for="address2">Address 2</label>
                    <input type="text" id="address2" class="input">
                </fieldset>

                <fieldset class="field">
                    <label for="city">City</label>
                    <input type="text" id="city" class="input" required>
                </fieldset>

                <fieldset class="field">
                    <label for="state">State</label>
                    <input type="text" id="state" class="input" required>
                </fieldset>

                <fieldset class="field">
                    <label for="zip">Zip</label>
                    <input type="text" id="zip" class="input" required>
                </fieldset>
            </section>
            
            <button class="btn" type="submit" onclick="document.location='products.html'">Sign Up</button>
        </form>
    </main>

     <footer>
        <p>
            &copy; 2026 - Naturally a Deal
        </p>
    </footer>
</body>
</html>
