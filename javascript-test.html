<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/products.css" />
  </head>

  <body>
    <header>
      <a href="#" class="logo">Naturally a Deal</a>
      <nav>
        <div class="nav-top">
          <p>Hello, E</p>
          <p>|</p>
          <a href="signup.html">Log Out</a>
        </div>
        <div class="nav-bottom">
          <search class="search">Search products...</search>
          <a href="products.html" class="button" id="current-page">Products</a>
          <a href="cart.html" class="button">Cart</a>
          <div class="cart-total">
            <img src="" alt="cart" />
            <p>$0.00</p>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <div id="product-container">
        <!-- Product categories and cards will go here -->
      </div>

      <!-- Template for a product category -->
      <template id="category-template">
        <h1 class="category-title"></h1>

        <div class="items"></div>
      </template>

      <!-- Template for an individual product -->
      <template id="product-template">
        <div class="product">
          <div class="img-container">
            <img class="product-image" src="" alt="" />
          </div>

          <div class="text-container">
            <h3 class="title"></h3>

            <p class="price"></p>

            <p class="unit"></p>

            <p class="date"></p>

            <button class="cart-button">Add to Cart</button>
          </div>
        </div>
      </template>
    </main>

    <footer>
      <p>&copy; 2026 - Naturally a Deal</p>
    </footer>

    <script src="products.js"></script>
  </body>
</html>
